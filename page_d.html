<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airin Cate&Bakery</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Sansita+Swashed:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        sansita: ['"Sansita Swashed"', 'cursive', 'serif'],
                    },
                    colors: {
                        accent: '#8c4327',
                        'accent-hover': '#72341d',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-800 antialiased font-inter">

    <!-- ==================== SECTION 1: HEADER & HERO ==================== -->
    <section class="relative bg-cover bg-center min-h-[600px] md:min-h-[700px] flex flex-col justify-between" style="background-image: url('./images/D1.png');">
        <!-- Overlay if image is light to ensure text readability -->
        <div class="absolute inset-0 bg-black/20"></div>

        <!-- Header / Navigation -->
        <header class="relative z-10 container mx-auto px-6 md:px-12 py-6 flex items-center justify-between">
            <div class="flex items-center">
                <img src="./images/logoD.png" alt="Bakery Logo" class="h-12 md:h-16 object-contain">
            </div>
            
            <nav class="flex items-center gap-6 md:gap-10 font-poppins text-white text-base md:text-lg font-medium">
                <a href="#home" class="hover:text-amber-200 transition-colors">Home</a>
                <a href="#blog" class="hover:text-amber-200 transition-colors">Blog</a>
                <a href="#contact" class="hover:text-amber-200 transition-colors">Contact Us</a>
                <a href="#services" class="hover:text-amber-200 transition-colors">Services</a>
            </nav>
        </header>

        <!-- Hero Content -->
        <div class="relative z-10 container mx-auto px-6 md:px-12 py-16 md:py-24 my-auto">
            <div class="max-w-xl text-white">
                <p class="font-inter text-lg md:text-xl font-normal tracking-wide text-amber-100 mb-2">Delicious Cafe</p>
                <h1 class="font-sansita text-4xl md:text-6xl lg:text-7xl font-bold leading-tight mb-8">
                    Sweet Treats,<br>Perfect Eats
                </h1>
                
                <div class="flex items-center gap-6 font-inter">
                    <a href="#shop" class="bg-[#8c4327] hover:bg-[#72341d] text-white px-8 py-3 rounded-md font-medium text-base md:text-lg shadow-lg transition-colors">
                        Shop Now
                    </a>
                    <a href="#about" class="text-white hover:text-amber-200 font-medium text-base md:text-lg transition-colors">
                        Learn More
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== SECTION 2: TOP PRODUCTS ==================== -->
    <section class="bg-white py-16 md:py-24">
        <div class="container mx-auto px-4 md:px-12">
            <!-- Section Title -->
            <h2 class="font-sansita text-4xl md:text-5xl text-center text-gray-900 mb-12">
                Top Products
            </h2>

            <!-- Top Products Grid Image -->
            <div class="max-w-5xl mx-auto mb-16">
                <img src="./images/D2.png" alt="Top Products" class="w-full h-auto object-contain mx-auto">
            </div>

            <!-- Bottom Promo Banner Image -->
            <div class="max-w-6xl mx-auto">
                <img src="./images/D3.png" alt="Special Offer Banner" class="w-full h-auto object-cover rounded-lg shadow-sm">
            </div>
        </div>
    </section>

    <!-- ==================== SECTION 3: EXPLORE MORE ==================== -->
    <section class="bg-white py-12 md:py-20">
        <div class="container mx-auto px-4 md:px-12">
            <!-- Section Title -->
            <h2 class="font-sansita text-4xl md:text-5xl text-center text-gray-900 mb-8">
                Explore More
            </h2>

            <!-- Categories Tabs -->
            <div class="flex flex-wrap justify-center items-center gap-6 md:gap-10 font-poppins text-gray-700 text-base md:text-lg mb-12">
                <button class="font-semibold text-gray-900 border-b-2 border-[#8c4327] pb-1">Cake</button>
                <button class="hover:text-gray-900 pb-1 transition-colors">Muffins</button>
                <button class="hover:text-gray-900 pb-1 transition-colors">Croissant</button>
                <button class="hover:text-gray-900 pb-1 transition-colors">Bread</button>
                <button class="hover:text-gray-900 pb-1 transition-colors">Tart</button>
                <button class="hover:text-gray-900 pb-1 transition-colors">Favorite</button>
            </div>

            <!-- Menu Grid Image -->
            <div class="max-w-5xl mx-auto mb-16">
                <img src="./images/D4.png" alt="Menu Grid" class="w-full h-auto object-contain mx-auto">
            </div>

            <!-- About Us Banner Image -->
            <div class="max-w-6xl mx-auto">
                <img src="./images/D5.png" alt="About Us Banner" class="w-full h-auto object-cover rounded-lg shadow-sm">
            </div>
        </div>
    </section>

    <!-- ==================== SECTION 4: FEATURED TREATS ==================== -->
    <section class="bg-white py-12 md:py-20">
        <div class="container mx-auto px-4 md:px-12">
            <!-- Section Title -->
            <h2 class="font-sansita text-4xl md:text-5xl text-center text-gray-900 mb-12">
                Featured Treats
            </h2>

            <!-- Items Cards Grid -->
            <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-12">
                <!-- Product 1 -->
                <div class="flex flex-col items-center text-center">
                    <div class="w-full overflow-hidden rounded-lg mb-4">
                        <img src="./images/D6.png" alt="Puff Pastry" class="w-full h-auto object-cover">
                    </div>
                    <div class="flex items-center justify-between w-full px-2 font-inter">
                        <span class="font-bold text-gray-900 text-lg">Puff Pastry</span>
                        <span class="font-bold text-gray-900 text-lg">8 Baht</span>
                    </div>
                </div>

                <!-- Product 2 -->
                <div class="flex flex-col items-center text-center">
                    <div class="w-full overflow-hidden rounded-lg mb-4">
                        <img src="./images/D7.png" alt="Doughnuts" class="w-full h-auto object-cover">
                    </div>
                    <div class="flex items-center justify-between w-full px-2 font-inter">
                        <span class="font-bold text-gray-900 text-lg">Doughnuts</span>
                        <span class="font-bold text-gray-900 text-lg">8 Baht</span>
                    </div>
                </div>

                <!-- Product 3 -->
                <div class="flex flex-col items-center text-center">
                    <div class="w-full overflow-hidden rounded-lg mb-4">
                        <img src="./images/D8.png" alt="Brownies" class="w-full h-auto object-cover">
                    </div>
                    <div class="flex items-center justify-between w-full px-2 font-inter">
                        <span class="font-bold text-gray-900 text-lg">Brownies</span>
                        <span class="font-bold text-gray-900 text-lg">8 Baht</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== SECTION 5: FOOTER ==================== -->
    <footer class="w-full">
        <img src="./images/D9.png" alt="Footer Section" class="w-full h-auto object-cover block">
    </footer>

</body>
</html>
